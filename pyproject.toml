[project]
name = "cloud-platform-application"
version = "0.1.0"
description = "A Flask API used to build and learn a cloud-native platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-flask>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
