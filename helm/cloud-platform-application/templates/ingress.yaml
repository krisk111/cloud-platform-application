apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: cloud-platform-application

spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-platform-application
                port:
                  number: {{ .Values.service.port }}